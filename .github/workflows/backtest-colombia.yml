name: Backtest base Colombia

on:
  pull_request:
    paths:
      - "config/colombia_baseline_v1.json"
      - "src/backtest_colombia.py"
      - "tests/test_backtest_colombia.py"
      - ".github/workflows/backtest-colombia.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q tests/test_backtest_colombia.py
      - name: Ejecutar backtest con datos reales
        run: PYTHONPATH=. python src/backtest_colombia.py --output-dir colombia-results
      - name: Guardar resultados
        uses: actions/upload-artifact@v4
        with:
          name: colombia-baseline-results
          path: colombia-results/
