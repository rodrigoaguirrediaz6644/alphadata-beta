name: Backtest exploratorio Beta-Insider

# Investigación paralela, NO forma parte de la metodología oficial
# (Sigma-6 / Delta-12). No toca data/, reports/ ni strategy_state.json.
# Se dispara solo al tocar este archivo o algo dentro de research/,
# y también se puede lanzar manualmente. Los resultados quedan
# committeados en research/insider_backtest/results/ para poder
# leerlos después sin tener que recalcular nada.

# Beta-Insider quedó descartada como estrategia (ver el informe de resultados):
# el backtest se conserva como registro, pero sólo corre cuando se pide a mano.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alphadata-escritura-en-main
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Validar funciones puras del backtest (sin red)
        run: PYTHONPATH=. python -m pytest -q tests/test_insider_backtest_math.py

      - name: Cachear ZIPs trimestrales de la SEC ya descargados
        uses: actions/cache@v4
        with:
          path: research/insider_backtest/.sec_cache
          key: sec-insider-zips-${{ hashFiles('research/insider_backtest/fetch_and_backtest.py') }}
          restore-keys: |
            sec-insider-zips-

      - name: Correr backtest (descarga SEC + Yahoo Finance y calcula)
        run: PYTHONPATH=. python -m research.insider_backtest.fetch_and_backtest

      - name: Conservar resultados como artefacto
        uses: actions/upload-artifact@v5
        with:
          name: beta-insider-backtest-${{ github.run_number }}
          path: research/insider_backtest/results/
          retention-days: 90

      - name: Guardar resultados en el repo
        run: |
          git config user.name "alphadata-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/insider_backtest/results
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
            exit 0
          fi
          git commit -m "research: actualizar backtest exploratorio Beta-Insider"
          # Varios workflows escriben en main y pueden terminar a la vez. Se
          # reintenta rebasando sobre lo que haya llegado antes, en vez de
          # perder los resultados ya calculados.
          for intento in 1 2 3; do
            git pull --rebase --autostash origin main || exit 1
            if git push; then
              exit 0
            fi
            echo "Push rechazado (intento $intento de 3); reintentando..."
            sleep 10
          done
          echo "No fue posible guardar los resultados tras 3 intentos." >&2
          exit 1
