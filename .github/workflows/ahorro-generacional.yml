name: Ahorro Generacional

# **Registro hacia adelante de la grilla de parametros AFP. No opera nada.**
#
# El backtest ya no puede discriminar entre estos parametros: la banda se
# eligio despues de ver los datos, el largo de la media tambien, y lo ultimo
# que aprendimos es que hasta el precipicio del parametro es un rasgo de la
# ventana y no de la regla. Lo unico que queda es dejar correr el tiempo sobre
# datos que nadie miro antes de elegir.
#
# Vive aparte del flujo que produce el informe **a proposito**, igual que
# Vigilancia: no comparte insumos, no comparte fallas, y si se cae no arrastra
# nada. Lo unico que comparte es el grupo de concurrencia, porque los dos
# escriben en main y dos push simultaneos se pisan.
#
# Y no instala dependencias: `src/registro_generacional.py` usa solo biblioteca
# estandar. El pin de pandas ya nos rompio corridas antes; un trabajo diario
# que tiene que seguir andando solo durante anios no deberia depender de eso.
on:
  workflow_dispatch:
    inputs:
      simular_aviso:
        description: "Mandar un aviso de ensayo para comprobar que el correo llega"
        type: boolean
        default: false
  schedule:
    # Todos los dias a las 13:30 UTC, unos 40 minutos despues de Vigilancia
    # para no chocar en el grupo de concurrencia. El valor cuota del dia se
    # publica con rezago, asi que la corrida de hoy registra el ultimo dia de
    # cotizacion disponible, no necesariamente el de hoy.
    - cron: "30 13 * * *"

permissions:
  contents: write

concurrency:
  group: alphadata-escritura-en-main
  cancel-in-progress: false

jobs:
  registrar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Calcular la grilla, avisar si cambia, y guardar
        # Sale en rojo en tres casos, los tres a proposito: si la fuente
        # reescribio historia ya registrada, si el valor cuota dio un salto
        # imposible, y **si habia que avisar un cambio de fondo y el correo no
        # salio**. Ese ultimo es el que importa: un aviso que no llega es peor
        # que no tener aviso, porque Rodrigo va a estar confiando.
        #
        # El archivo se guarda igual en los dos ultimos casos: el registro es
        # lo principal y una falla de la notificacion no puede hacerle perder
        # un dia. Por eso el paso siguiente lleva `always()`.
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
          SIMULAR_AVISO: ${{ inputs.simular_aviso }}
        run: PYTHONPATH=. python -m src.registro_generacional

      - name: Guardar el dia
        # `always()` porque el paso anterior sale en rojo cuando el aviso no
        # pudo enviarse, y justo en esa corrida es cuando mas importa que la
        # fila quede commiteada con su marca de `fallo`: es el unico rastro de
        # que hubo un cambio de fondo que Rodrigo no recibio.
        if: always()
        run: |
          git config user.name "alphadata-bot"
          git config user.email "actions@users.noreply.github.com"
          git add registro/ahorro_generacional.csv
          if git diff --cached --quiet; then
            echo "Sin dias nuevos de cotizacion; no hay nada que guardar."
            exit 0
          fi
          git commit -m "registro: dia de la grilla AFP"
          for intento in 1 2 3; do
            git pull --rebase --autostash origin main || exit 1
            if git push; then
              exit 0
            fi
            echo "Push rechazado (intento $intento de 3); reintentando..."
            sleep 10
          done
          echo "No fue posible guardar el registro tras 3 intentos." >&2
          exit 1
