name: Actualizar precios AlphaData

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * 6"

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: PYTHONPATH=. python -m pytest -q

      - name: Descargar y validar precios
        run: python src/fetch_prices.py

      - name: Calcular consenso y backtest piloto
        run: python src/backtest.py

      - name: Guardar actualización
        run: |
          git config user.name "alphadata-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices_weekly.csv data/coverage_report.csv data/signals_weekly.csv data/backtest_weekly.csv data/backtest_summary.csv
          git diff --cached --quiet || git commit -m "data: actualizar precios semanales"
          git push
