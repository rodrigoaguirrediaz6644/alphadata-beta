name: Ejecutar AlphaData

# Corrida oficial semanal. Estuvo suspendida entre el 20-09-2026 y el
# 21-09-2026, mientras se reparaba el feed chileno detenido desde el 17-07.
#
# Se reactivó con la condición redefinida —fuente única con las tres guardias
# operando, más contraste manual mensual— que está documentada y justificada en
# INCIDENTE_FEED_CHILENO.md. Los precios chilenos ya no se descargan acá: los
# trae la captura diaria desde la cotización viva.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * 5"

permissions:
  contents: write

concurrency:
  group: alphadata-escritura-en-main
  cancel-in-progress: false

jobs:
  calculate-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Validar código y metodologías
        run: |
          PYTHONPATH=. python -m pytest -q
          PYTHONPATH=. python -m src.strategy_registry

      - name: Descargar y calcular estrategias bursátiles
        run: PYTHONPATH=. python alphadata.py run

      # **Horizonte no puede callar al informe.** Es una pieza secundaria -elige
      # entre dos fondos de AFP- y su insumo viene de FRED, que no responde
      # desde los runners de GitHub aunque responda en local. Cuando fallaba,
      # se llevaba por delante el informe completo y el correo: la cartera, el
      # panel de salud y la guia de ingreso no salian por un problema de otra
      # cosa. Que el paso siga en rojo esta bien; que detenga el resto, no.
      #
      # El informe dice si Horizonte quedo viejo, asi que esto no esconde nada.
      - name: Descargar, calcular e incorporar Estrategia Horizonte
        continue-on-error: true
        run: PYTHONPATH=. python -m src.horizonte

      - name: Enviar informe semanal
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
          REPORT_SUBJECT: "AlphaData — informe semanal de estrategias"
        run: python src/send_report.py

      - name: Conservar informe como artefacto
        uses: actions/upload-artifact@v5
        with:
          name: informe-alphadata-${{ github.run_number }}
          path: |
            reports/latest_report.md
            reports/latest_report.html
            reports/seguimiento_vivo.png
            reports/reconstruccion.png
            data/portfolio_sigma6.csv
            data/portfolio_delta12.csv
            data/portfolio_gamma6.csv
            data/movements_sigma6.csv
            data/movements_delta12.csv
            data/movements_gamma6.csv
            data/strategy_nav.csv
            data/reconstruccion_historica.csv
            data/dividendos.csv
            data/dividendos_pendientes.csv
            data/horizonte_state.json
            data/horizonte_quotes.csv
            data/horizonte_signals.csv
            data/horizonte_trades.csv
            data/horizonte_backtest_summary.csv
            data/horizonte_annual.csv
            data/recommendations_errors.csv
            data/recommendations_history.csv
            data/coverage_report.csv
            data/revisiones_precios.csv
            data/acciones_corporativas_detectadas.csv
          retention-days: 90

      - name: Guardar carteras, historial e informe
        run: |
          git config user.name "alphadata-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
            exit 0
          fi
          git commit -m "data: actualizar estrategias e informe semanal"
          # Varios workflows escriben en main y pueden terminar a la vez. Se
          # reintenta rebasando sobre lo que haya llegado antes, en vez de
          # perder los resultados ya calculados.
          for intento in 1 2 3; do
            git pull --rebase --autostash origin main || exit 1
            if git push; then
              exit 0
            fi
            echo "Push rechazado (intento $intento de 3); reintentando..."
            sleep 10
          done
          echo "No fue posible guardar los resultados tras 3 intentos." >&2
          exit 1
