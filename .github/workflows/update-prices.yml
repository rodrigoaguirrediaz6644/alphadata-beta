name: Ejecutar AlphaData

# Corrida oficial semanal. Estuvo suspendida entre el 20-09-2026 y el
# 21-09-2026, mientras se reparaba el feed chileno detenido desde el 17-07.
#
# Se reactivó con la condición redefinida —fuente única con las tres guardias
# operando, más contraste manual mensual— que está documentada y justificada en
# INCIDENTE_FEED_CHILENO.md. Los precios chilenos ya no se descargan acá: los
# trae la captura diaria desde la cotización viva.
#
# El informe se ejecuta únicamente en la corrida programada del viernes o por
# lanzamiento manual. No se recupera automáticamente en días de semana.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * 5"
permissions:
  contents: write
  # Para que el aviso de falla pueda leer que paso fallo.
  actions: read

concurrency:
  group: alphadata-escritura-en-main
  cancel-in-progress: false

jobs:
  decidir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      correr: ${{ steps.decision.outputs.correr }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          # El historial completo: la fecha del último informe se lee del
          # historial, igual que en Vigilancia.
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Decidir si hay una corrida que calcular
        id: decision
        env:
          EVENTO: ${{ github.event_name }}
          CAPTURA: ${{ github.event.workflow_run.conclusion }}
        run: PYTHONPATH=. python -m src.recuperacion

      # Ultimo paso a proposito: corre solo si algo de arriba fallo, y avisa el
      # mismo dia. Ver src/aviso_falla.py.
      - name: Avisar por correo que la corrida falló
        if: failure()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: PYTHONPATH=. python3 -m src.aviso_falla

  calculate-and-report:
    needs: decidir
    if: needs.decidir.outputs.correr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Validar código y metodologías
        run: |
          PYTHONPATH=. python -m pytest -q
          PYTHONPATH=. python -m src.strategy_registry

      - name: Descargar y calcular estrategias bursátiles
        run: PYTHONPATH=. python alphadata.py run

      # **Horizonte salio del informe el 23-09-2026.** La reemplazo Ahorro
      # Generacional, que contesta la misma pregunta -en que fondo esta la
      # plata previsional- y dos estrategias contestando lo mismo es un valor
      # con mas de una casa. Ver src/horizonte.py y registro/README.md.
      #
      # Sacarla se llevo con ella la unica consulta a FRED del informe del
      # viernes: la fuente externa que ya tumbo el correo y el commit una vez.
      # Ese es el premio, y vale mas que la seccion que se pierde.

      - name: Guardar carteras, historial e informe
        run: |
          git config user.name "alphadata-bot"
          git config user.email "actions@users.noreply.github.com"
          for intento in 1 2 3; do
            git add data reports
            if git diff --cached --quiet; then
              echo "Sin cambios que guardar."
              exit 0
            fi
            git commit -m "data: actualizar estrategias e informe semanal"
            if git push; then
              exit 0
            fi
            if [ "$intento" -lt 3 ]; then
              echo "La base cambió durante el guardado; se actualiza y se recalcula (intento $intento de 3)..."
              git fetch origin main
              git reset --hard origin/main
              PYTHONPATH=. python alphadata.py run
            fi
          done
          echo "No fue posible guardar los resultados tras 3 intentos." >&2
          exit 1

      - name: Conservar informe como artefacto
        uses: actions/upload-artifact@v5
        with:
          name: informe-alphadata-${{ github.run_number }}
          path: |
            reports/latest_report.md
            reports/latest_report.html
            reports/reconstruccion.png
            reports/ahorro_generacional.png
            data/portfolio_sigma6.csv
            data/portfolio_delta12.csv
            data/portfolio_gamma6.csv
            data/movements_sigma6.csv
            data/movements_delta12.csv
            data/movements_gamma6.csv
            data/strategy_nav.csv
            data/reconstruccion_historica.csv
            data/dividendos.csv
            data/dividendos_pendientes.csv
            data/recommendations_errors.csv
            data/recommendations_history.csv
            data/coverage_report.csv
            data/revisiones_precios.csv
            data/acciones_corporativas_detectadas.csv
          retention-days: 90

      - name: Enviar informe semanal
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
          REPORT_SUBJECT: "AlphaData — informe semanal de estrategias"
        run: python src/send_report.py

      # Ultimo paso a proposito: corre solo si algo de arriba fallo, y avisa el
      # mismo dia. Ver src/aviso_falla.py.
      - name: Avisar por correo que la corrida falló
        if: failure()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: PYTHONPATH=. python3 -m src.aviso_falla
