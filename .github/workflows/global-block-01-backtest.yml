name: Global Blocks 01-02 Backtest

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/global-block-01-backtest.yml"
      - "config/global_universe_block_01.json"
      - "config/global_universe_block_02.json"
      - "config/global_universe_blocks_01_02.json"
      - "scripts/run_global_block_01.py"
      - "src/global_instrument_backtest.py"
      - "src/global_momentum_strategy.py"
      - "tests/test_global_instrument_backtest.py"
      - "tests/test_global_momentum_strategy.py"
  push:
    branches:
      - agent/global-momentum-v1
    paths:
      - ".github/workflows/global-block-01-backtest.yml"
      - "config/global_universe_block_01.json"
      - "config/global_universe_block_02.json"
      - "config/global_universe_blocks_01_02.json"
      - "scripts/run_global_block_01.py"
      - "src/global_instrument_backtest.py"
      - "src/global_momentum_strategy.py"
      - "tests/test_global_instrument_backtest.py"
      - "tests/test_global_momentum_strategy.py"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install numpy pandas pytest yfinance

      - name: Run tests
        run: PYTHONPATH=. python -m pytest -q tests/test_global_instrument_backtest.py tests/test_global_momentum_strategy.py

      - name: Run real backtests and combined diagnostics
        run: |
          PYTHONPATH=. python scripts/run_global_block_01.py
          PYTHONPATH=. python scripts/run_global_block_01.py \
            --block config/global_universe_block_02.json \
            --output artifacts/global_block_02
          PYTHONPATH=. python scripts/run_global_block_01.py \
            --block config/global_universe_blocks_01_02.json \
            --output artifacts/global_blocks_01_02 \
            --diagnostics

      - name: Upload reproducible results
        uses: actions/upload-artifact@v4
        with:
          name: global-blocks-01-02-results
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
